<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12051f" />
  <title>For My Jaanu 💙 | Birthday Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="ambient"></div>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>
  <div class="topbar">
    <div class="brand">♡ Jaanu Universe</div>
    <div class="top-actions">
      <button class="icon-btn" id="soundToggle" aria-label="Toggle sound">🔊</button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☾</button>
      <button class="icon-btn" id="resetBtn" aria-label="Reset experience">↺</button>
    </div>
  </div>

  <main class="app-shell">
    <section class="hero glass">
      <div class="hero-badge">A little universe made with infinite love</div>
      <h1>Happy Birthday,<br><span>My Jaanu 💙</span></h1>
      <p class="hero-sub">20+ surprises • memories • games • wishes • one very special person</p>
      <div class="hero-actions">
        <button class="primary-btn" id="startBtn">Enter Your Universe ✨</button>
        <button class="secondary-btn" id="surpriseBtn">Random Love Note 💌</button>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="progressText">Chapter 1 of 20</span><span id="progressPercent">5%</span></div>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
    </section>

    <section class="chapter glass" id="chapterPanel">
      <div class="chapter-head">
        <span class="eyebrow" id="chapterEyebrow">CHAPTER 01</span>
        <h2 id="chapterTitle">Welcome to the Birthday Universe</h2>
        <p id="chapterDescription">Every click unlocks a tiny piece of my heart.</p>
      </div>
      <div id="chapterContent" class="chapter-content"></div>
      <div class="chapter-nav">
        <button class="secondary-btn" id="backBtn">← Back</button>
        <button class="primary-btn" id="nextBtn">Continue →</button>
      </div>
    </section>

    <section class="quick-grid">
      <button class="quick-card" data-jump="5">📸<span>Memories</span></button>
      <button class="quick-card" data-jump="8">🎁<span>Gifts</span></button>
      <button class="quick-card" data-jump="14">🎬<span>Video</span></button>
      <button class="quick-card" data-jump="19">💙<span>Final Note</span></button>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-card glass">
      <button class="modal-close" id="modalClose">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>made by mehboob</footer>
  <audio id="bgMusic" loop preload="auto" src="birthday.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
